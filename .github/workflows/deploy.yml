name: 采集数据并部署

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml

      - name: 采集数据并生成报告
        run: python generate_report.py
        env:
          PYTHONWARNINGS: ignore
          TZ: Asia/Shanghai

      - name: 准备 Pages 文件
        run: |
          mkdir -p pages
          cp dashboard.html pages/index.html

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
